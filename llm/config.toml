# 작업별 LLM 설정. 코드에서 load_config("extract")처럼 칸 이름으로 고른다.
# 환자 데이터를 다루는 작업은 patient_data = true (로컬 provider만 허용).
# API 키는 여기 두지 않는다 (.env).

# [1] 입력 모듈 IN-2 필드 추출 (A). 모델 결정: qwen3:14b (2026-10-29, A가 선택. 근거 src/input/llm_performance.md)
# 다른 단계(BM-1 보고서 파싱, LLM 추천, 급여 조건 구조화)의 LLM은 별개로, 자기 칸을 따로 추가한다.
[extract]
provider = "ollama"
model = "qwen3:14b"
patient_data = true
temperature = 0
device = "auto"

# 입력 모듈 개발·시험용 ([extract]와 같은 모델. 비교할 때만 load_config("extract", model="hf.co/mradermacher/hari-q3-8b-GGUF:Q4_K_M"))
[extract_dev]
provider = "ollama"
model = "qwen3:14b"
patient_data = true
temperature = 0
device = "auto"

# [4] LLM 추천 (B). 모델: qwen3:14b (2026-11-02, B가 정함. A·C·D 확인). 선택 이유는 src/recommend/README.md "LLM 모델".
# A 비교(src/input/llm_performance.md)에서 B 일에도 필요한 근거 위치 정확도·처음 보는 사례 처리가 더 좋았고, 팀이 이미 쓰는 모델이다.
# 추천 성능은 아직 재지 않았다: 연결 뒤 가상 환자로 재서(허용 선택지 비율, 안전 위반 0건) 부족하면 다시 고른다.
# 질문지에 지침·급여 청크가 함께 들어가 기본 문맥 8192보다 크게 둔다.
[recommend]
provider = "ollama"
model = "qwen3:14b"
patient_data = true
temperature = 0
device = "auto"
num_ctx = 16384
