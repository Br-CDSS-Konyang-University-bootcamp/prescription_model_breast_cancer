# 작업별 LLM 설정. 코드에서 load_config("extract")처럼 칸 이름으로 고른다.
# 환자 데이터를 다루는 작업은 patient_data = true (로컬 provider만 허용).
# API 키는 여기 두지 않는다 (.env).

# [1] 입력 모듈 IN-2 필드 추출 (A). 모델 결정: notes/llm_components.md (2026-10-19, snuh/hari-q3-8b Q4_K_M)
[extract]
provider = "ollama"
model = "hf.co/mradermacher/hari-q3-8b-GGUF:Q4_K_M"
patient_data = true
temperature = 0
device = "auto"

# 개발·시험용 (2026-10-20: hari-q3-8b로 통일. 비교할 때만 load_config("extract", model="qwen2.5:7b"))
[extract_dev]
provider = "ollama"
model = "hf.co/mradermacher/hari-q3-8b-GGUF:Q4_K_M"
patient_data = true
temperature = 0
device = "auto"
